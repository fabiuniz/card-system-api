<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Server Funcionando</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f9;
    color: #1e293b;
    text-align: center;
  }
  .box {
    max-width: 480px;
    margin: 40px auto;
    padding: 24px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  h1 { color: #16a34a; font-size: 1.5rem; margin: 0 0 8px 0; }
  p  { margin: 6px 0; font-size: 0.95rem; }
  code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="box">
    <h1>✅ Web server funcionando!</h1>
    <p>Esta página foi carregada de <code>assets/apps.htm</code>.</p>
    <p id="origem"></p>
    <p id="hora"></p>
  </div>
<script>
  document.getElementById('origem').textContent = 'URL: ' + location.href;
  document.getElementById('hora').textContent = 'Carregada em: ' + new Date().toLocaleString();
</script>
</body>
</html>
